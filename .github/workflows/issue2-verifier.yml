name: Issue 2 branch verification

on:
  push:
    branches: ["security/pages-privilege-isolation"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build and verify artifact
        run: |
          npm run build
          find _site -type f | sort
          cmp index.html _site/index.html
          cmp styles.css _site/styles.css
          cmp app.js _site/app.js
          cmp src/calculators.mjs _site/src/calculators.mjs

      - name: Configure Pages with read-only token
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact with read-only token
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
