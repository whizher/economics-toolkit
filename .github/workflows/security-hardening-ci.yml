name: Security hardening branch verification

on:
  push:
    branches: ["security/harden-ci-pages"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run checks and tests
        run: npm test

      - name: Build and inspect public artifact when available
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
            find _site -type f | sort
            cmp index.html _site/index.html
            cmp styles.css _site/styles.css
            cmp app.js _site/app.js
            cmp src/calculators.mjs _site/src/calculators.mjs
          fi
